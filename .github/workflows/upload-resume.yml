name: Update Naukri Profile

on:
  workflow_dispatch:
    inputs:
      resume_path:
        description:
          Absolute path to a private PDF available on the self-hosted runner
        required: true
        type: string

jobs:
  update-profile:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Naukri profile
        uses: ./
        with:
          mode: both
          username: ${{ secrets.NAUKRI_USERNAME }}
          password: ${{ secrets.NAUKRI_PASSWORD }}
          profile_id: ${{ secrets.NAUKRI_PROFILE_ID }}
          resume_path: ${{ inputs.resume_path }}
          resume_headline: ${{ secrets.NAUKRI_RESUME_HEADLINE }}
