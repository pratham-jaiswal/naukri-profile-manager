name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript and scheduler tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci

      - name: Check Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test scheduler config
        run: python -m unittest scheduler.test_scheduler_config

      - name: Package
        run: npm run package
