name: Naukri Profile Manager
description:
  Keep your Naukri profile active by uploading resumes and updating the resume
  headline
author: Pratham Jaiswal

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: upload-cloud
  color: blue

# Define your inputs here.
inputs:
  mode:
    description: 'Update mode: headline, resume, or both'
    required: false
    default: 'both'
  username:
    description: 'Naukri.com email'
    required: true
  password:
    description: 'Naukri.com password'
    required: true
  resume_path:
    description: 'Path to the resume file; required for resume and both modes'
    required: false
  profile_id:
    description: 'profileId of the naukri.com account'
    required: true
  profile_summary:
    description:
      'Legacy input; profile summary updates are not currently implemented'
    required: false
  resume_headline:
    description:
      'Resume headline to update (optional - shown at the top of your Naukri
      profile, maximum 250 characters)'
    required: false

# Define your outputs here.
outputs:
  upload_status:
    description: 'Status of the resume upload (success/failure)'
  upload_time:
    description: 'Timestamp of the upload operation'

runs:
  using: node20
  main: dist/index.js
